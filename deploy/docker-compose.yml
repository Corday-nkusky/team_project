# CampusClaw 一键启动（tasks 1.2 / 5.2）
#
#   node scripts/up.mjs        # 一条命令：生成 .env（随机密钥）→ 构建 → 启动 → 探活
#
# 手动方式：
#   cd deploy && cp .env.example .env   # 必须先把 JWT_SECRET 换成随机长串
#   docker compose up -d --build
#   curl http://127.0.0.1:8080/health
#
# 说明：
#   - 部署关键项一律由环境变量注入，缺项时 compose 直接拒绝启动（spec R8）。
#   - 不配置 LLM_API_KEY 时，系统仍可完整跑通（问答走「抽取式」降级）；
#     配置后问答由模型生成，检索额外启用向量路。
#   - MySQL 只映射到宿主机 13306，避免与宿主机已装的 MySQL（3306）冲突；
#     Qdrant 不对外映射端口，仅容器内网访问。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # 部分内核下需放开 seccomp，否则初始化报
    # "Can't create thread to handle bootstrap (errno: 1)" 并退出（与 qdrant 同因）。
    security_opt:
      - seccomp=unconfined
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置，请先运行 node scripts/up.mjs}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE 未设置}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER 未设置}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置}
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    # 部分内核下需放开 seccomp，否则容器内会 panic: can't spawn worker thread
    security_opt:
      - seccomp=unconfined
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER 未设置}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE 未设置}
      QDRANT_URL: http://qdrant:6333
      REQUIRE_DEPS: "true"
      DEP_WAIT_SECONDS: "90"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请先运行 node scripts/up.mjs}
      ACCESS_TTL_SECONDS: ${ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-chat}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-text-embedding-3-small}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  mysql-data:
  qdrant-data:
