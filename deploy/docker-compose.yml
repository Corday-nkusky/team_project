# CampusClaw 一键启动（tasks 1.2 / 5.2）
#
#   cd deploy
#   cp .env.example .env      # 首次
#   docker compose up -d --build
#   curl http://127.0.0.1:8080/health
#
# 说明：
#   - 不配置 LLM_API_KEY 时，系统仍可完整跑通（问答走「抽取式」降级）；
#     配置后问答由模型生成，检索额外启用向量路。
#   - MySQL 只映射到宿主机 13306，避免与宿主机已装的 MySQL（3306）冲突；
#     Qdrant 不对外映射端口，仅容器内网访问。
#   - qdrant 未设 healthcheck：镜像内无 curl/wget，就绪等待由后端自身的重试承担。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # 部分内核下需放开 seccomp，否则初始化报
    # "Can't create thread to handle bootstrap (errno: 1)" 并退出（与 qdrant 同因）。
    security_opt:
      - seccomp=unconfined
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
      MYSQL_USER: ${MYSQL_USER:-campusclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-changeme-root}"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    # 部分内核下需放开 seccomp，否则容器内会 panic: can't spawn worker thread
    security_opt:
      - seccomp=unconfined
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-campusclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
      QDRANT_URL: http://qdrant:6333
      REQUIRE_DEPS: "true"
      DEP_WAIT_SECONDS: "90"
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      ACCESS_TTL_SECONDS: ${ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-chat}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-text-embedding-3-small}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  mysql-data:
  qdrant-data:
