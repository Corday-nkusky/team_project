# CampusClaw 一键启动（tasks 1.2）
#
#   cd deploy && docker compose up -d
#
# 说明：
#   - 反向代理（nginx）待前端就绪后加入本轮（见 tasks 1.2 注）。
#   - qdrant 未设 healthcheck：镜像内无 curl/wget；就绪等待由后端自身的重试承担。

name: campusclaw

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
      MYSQL_USER: ${MYSQL_USER:-campusclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-changeme-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    # 部分内核下需放开 seccomp，否则容器内会 panic: can't spawn worker thread
    security_opt:
      - seccomp=unconfined
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-campusclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
      QDRANT_URL: http://qdrant:6333
      REQUIRE_DEPS: "true"
      DEP_WAIT_SECONDS: "90"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  mysql-data:
  qdrant-data:
