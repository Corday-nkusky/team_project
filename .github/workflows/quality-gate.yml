name: quality-gate

# 课程第 9/11 课：两条门禁挂进 CI，命令与本地 make check / make check-security 同一条。
# main 保护需在仓库设置里开启「Require a pull request before merging」+「Require status checks」，
# 并把本工作流的两个 check（check / check-security）设为必需（见 docs/ci-setup.md）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: make check
        run: make check

      - name: Upload rollback and retry (MySQL)
        working-directory: backend
        env:
          MYSQL_TEST_ADDR: 127.0.0.1:${{ job.services.mysql.ports[3306] }}
        run: go test -tags=mysqlintegration ./internal/store -run '^TestUploadRollbackAndRetry$' -count=1 -v

      - name: Ask benchmark stream checks
        run: node --test scripts/bench-ask-stream.test.mjs

      - name: Operating systems lecture checks
        run: node --test seed-data/operating-systems/seed.test.mjs

  check-security:
    name: check-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: make check-security
        run: make check-security

  image:
    name: image-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image with commit version
        run: docker build -f deploy/backend.Dockerfile --build-arg "VERSION=${GITHUB_SHA}" -t campusclaw:ci .

      - name: Verify commit version through health endpoint
        run: |
          docker run -d --name campusclaw-version -p 8080:8080 \
            -e HTTP_ADDR=:8080 -e REQUIRE_DEPS=false \
            -e MYSQL_HOST=127.0.0.1 -e MYSQL_PORT=3306 \
            -e MYSQL_USER=ci -e MYSQL_PASSWORD=ci-only-not-a-real-secret \
            -e MYSQL_DATABASE=campusclaw -e QDRANT_URL=http://127.0.0.1:6333 \
            -e JWT_SECRET=ci-version-check-only-0123456789abcdef0123456789abcdef \
            campusclaw:ci
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080/health > /tmp/campusclaw-health.json && \
               python3 -m json.tool /tmp/campusclaw-health.json >/dev/null; then
              break
            fi
            sleep 1
          done
          cat /tmp/campusclaw-health.json
          python3 -c 'import json, os; body=json.load(open("/tmp/campusclaw-health.json")); assert body["version"] == os.environ["GITHUB_SHA"], (body["version"], os.environ["GITHUB_SHA"])'

      - name: Show version-check container logs on failure
        if: failure()
        run: docker logs campusclaw-version

      - name: Remove version-check container
        if: always()
        run: docker rm -f campusclaw-version
